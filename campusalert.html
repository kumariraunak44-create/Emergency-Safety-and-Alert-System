<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Alert Network</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            padding: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            text-align: center;
            background: #ff3366;
            color: white;
            padding: 25px;
            border-radius: 12px;
            animation: slideDown 1s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .container {
            margin: 25px auto;
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            animation: fadeIn 1.2s ease-in;
        }

        label {
            font-weight: bold;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            resize: none;
            margin-top: 8px;
        }

        textarea:focus {
            border-color: #ff3366;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff3366;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #e6004c;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
        }

        .preview {
            margin-top: 20px;
            padding: 15px;
            background: #fff5f7;
            border-left: 5px solid #ff3366;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.6s ease-in;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            font-size: 18px;
            text-decoration: none;
        }

        a:hover {
            transform: scale(1.05);
            color: #0056b3;
        }

    </style>
</head>

<body>

    <header>
        <h1>Campus Alert Network</h1>
        <p>Send alerts instantly across the campus</p>
    </header>

    <div class="container">
        <label>Write Alert Message</label>
        <textarea id="alertText" placeholder="Describe the emergency or alert..."></textarea>

        <button onclick="sendCampusAlert()">📢 Send Alert</button>

        <div class="preview" id="alertPreview"></div>

        <a href="index.html">⬅ Back to Home</a>
    </div>

    <script>
        function sendCampusAlert() {
            let message = document.getElementById("alertText").value;

            if (message.trim() === "") {
                alert("Please write an alert message before sending.");
                return;
            }

            document.getElementById("alertPreview").style.display = "block";
            document.getElementById("alertPreview").innerHTML =
                "<strong>Alert Sent:</strong><br>" + message;

            document.getElementById("alertText").value = "";
        }
    </script>

</body>
</html>
